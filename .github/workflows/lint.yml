name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install black flake8

    - name: Check syntax with Python
      run: |
        python -m py_compile agent/state.py agent/graph.py api/schemas.py api/main.py
        python -m py_compile tools/spec_search.py tools/log_classifier.py tools/code_explainer.py
        echo "✓ All files have valid Python syntax"

    - name: Basic lint with flake8 (warnings only)
      run: |
        flake8 agent/ api/ tools/ evals/ tests/ --count --exit-zero --max-line-length=120 --statistics || true
        echo "✓ Flake8 check completed"

